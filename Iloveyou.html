<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    background: #000;
    max-width: 100vw;
    max-height: 100vh;
  }
</style>
</head>
<body>
<canvas id="heart"></canvas>

<script>
const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");

const colors = ["#ff1493", "#ff69b4", "#ff85c8", "#ffb6c1", "#ffc0cb", "#ffe4e1"];

function heartPoint(t) {
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = 13 * Math.cos(t)
          - 5 * Math.cos(2 * t)
          - 2 * Math.cos(3 * t)
          - Math.cos(4 * t);
  return { x, y };
}

let W, H, cx, cy, yOffset, baseFont, finalFont;

function resize() {
  const size = Math.min(window.innerWidth, window.innerHeight);
  const dpr = window.devicePixelRatio || 1;

  canvas.width = size * dpr;
  canvas.height = size * dpr;
  canvas.style.width = size + "px";
  canvas.style.height = size + "px";

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  W = size;
  H = size;
  cx = W / 2;
  cy = H / 2;
  yOffset = H * 0.05;

  // Крупные шрифты, зависящие от размера экрана
  baseFont = Math.max(10, W * 0.018);   // шрифт для точек-надписей
  finalFont = Math.max(28, W * 0.09);   // финальная надпись по центру
}

resize();
window.addEventListener("resize", () => {
  resize();
  // Перезапуск анимации при изменении размера
  scalesIdx = 0;
  i = 0;
  ctx.clearRect(0, 0, W, H);
});

const scales = [11, 12, 13, 14, 15, 16];
const totalI = 120;
let scalesIdx = 0;
let i = 0;

function drawStep() {
  if (scalesIdx >= scales.length) {
    // Финальная крупная надпись по центру сердечка
    ctx.fillStyle = "#ff1493";
    ctx.font = `bold ${finalFont}px Arial`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("I love you", cx, cy + yOffset);
    return;
  }

  const scale = scales[scalesIdx];
  const t = i * (Math.PI * 2) / totalI;
  const { x, y } = heartPoint(t);

  const px = cx + x * scale;
  const py = cy - y * scale + yOffset;

  ctx.fillStyle = colors[scalesIdx];
  ctx.font = `bold ${baseFont + scalesIdx}px Arial`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("I love you", px, py);

  i++;
  if (i >= totalI) {
    i = 0;
    scalesIdx++;
  }

  requestAnimationFrame(drawStep);
}

drawStep();
</script>
</body>
</html>
