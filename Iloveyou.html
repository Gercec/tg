<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    background: #000;
  }
</style>
</head>
<body>
<canvas id="heart"></canvas>

<script>
const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");

const colors = ["#ff1493", "#ff69b4", "#ff85c8", "#ffb6c1", "#ffc0cb", "#ffe4e1"];

function heartPoint(t) {
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = 13 * Math.cos(t)
          - 5 * Math.cos(2 * t)
          - 2 * Math.cos(3 * t)
          - Math.cos(4 * t);
  return { x, y };
}

let W, H, cx, cy, yOffset, heartScale, dotFont, finalFont;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  cx = W / 2;
  cy = H / 2;

  // Сердечко растягиваем почти на весь экран
  const minSide = Math.min(W, H);
  heartScale = minSide / 36;   // базовая формула сердца макс ~ ±16-18 по осям
  yOffset = H * 0.02;

  // Точки-надписи — крупные, ~3.5% от меньшей стороны
  dotFont = minSide * 0.035;

  // Финальная надпись — во всю ширину экрана
  finalFont = Math.min(W * 0.22, H * 0.18);
}

resize();
window.addEventListener("resize", () => {
  resize();
  scalesIdx = 0;
  i = 0;
  ctx.clearRect(0, 0, W, H);
});

const scales = [11, 12, 13, 14, 15, 16];
const totalI = 120;
let scalesIdx = 0;
let i = 0;

function drawStep() {
  if (scalesIdx >= scales.length) {
    // Финальная надпись во весь экран по центру
    ctx.fillStyle = "#ff1493";
    ctx.font = `bold ${finalFont}px Arial, sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("I love you", cx, cy + yOffset);
    return;
  }

  const scale = scales[scalesIdx] * (heartScale / 11);
  const t = i * (Math.PI * 2) / totalI;
  const { x, y } = heartPoint(t);

  const px = cx + x * scale;
  const py = cy - y * scale + yOffset;

  ctx.fillStyle = colors[scalesIdx];
  ctx.font = `bold ${dotFont}px Arial, sans-serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("I love you", px, py);

  i++;
  if (i >= totalI) {
    i = 0;
    scalesIdx++;
  }

  requestAnimationFrame(drawStep);
}

drawStep();
</script>
</body>
</html>
